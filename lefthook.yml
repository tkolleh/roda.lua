pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.lua"
      run: lx fmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.lua"
      run: lx lint {staged_files}
    justfile:
      run: |
        if echo {staged_files} | grep -q justfile; then
          just --fmt
        fi
      stage_fixed: true
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}
