---
name: Publish to LuaRocks

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-chain:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Check commit is on main branch
        uses: actions/github-script@60bee431bba7e65b608b8aa309be0eb0252f5e79 # v7.0.1
        with:
          script: |
            const { data: branches } = await github.rest.repos.listBranchesForHeadCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const isOnMain = branches.some(b => b.name === 'main');
            if (!isOnMain) {
              core.setFailed(`Commit ${context.sha} is not on main branch.`);
              return;
            }
            console.log('✓ Commit is on main branch');

      - name: Verify Release Please created this tag
        uses: actions/github-script@60bee431bba7e65b608b8aa309be0eb0252f5e79 # v7.0.1
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              console.log(`✓ Tag ${tag} verified as Release Please release`);
            } catch (error) {
              core.setFailed(`No release found for tag ${tag}. Not a Release Please release.`);
            }

  publish:
    needs: verify-chain
    if: |
      always() &&
      (needs.verify-chain.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: luarocks-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@bd58f7b97fe2147910580a33b677efadf746e179 # v1.0.1
        with:
          version: 0.28.2

      - name: Install LuaRocks (for validation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks

      - name: Generate and validate rockspec
        run: |
          echo "Generating rockspec..."
          lx generate-rockspec
          
          ROCKSPEC=$(find . -maxdepth 1 -name '*.rockspec' -print -quit)
          if [[ -z "$ROCKSPEC" ]]; then
            echo "::error::No rockspec file generated"
            exit 1
          fi
          
          echo "Validating rockspec: $ROCKSPEC"
          if ! luarocks lint "$ROCKSPEC"; then
            echo "::error::Rockspec validation failed. Check for malformed strings or syntax errors."
            echo "::error::Common cause: multiline TOML strings in lux.toml generate invalid Lua syntax."
            exit 1
          fi
          
          echo "✓ Rockspec valid: $ROCKSPEC"
          rm -f "$ROCKSPEC"

      - name: Upload to LuaRocks
        if: ${{ !env.ACT }}
        run: lx --verbose --lua-version 5.1 upload
        env:
          LUX_API_KEY: ${{ secrets.LUX_API_KEY }}
